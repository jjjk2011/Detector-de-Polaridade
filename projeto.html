<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e14">
    <title>Projeto do Sistema - AudioBase Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .results-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .res-item { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px 5px; text-align: center; }
        .res-item.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,210,255,0.2); }
        .res-item .lab { color: var(--dim); font-size: 0.55rem; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 1px; }
        .res-item .val { color: var(--accent); font-size: 1.1rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .res-item .sub { color: var(--dim); font-size: 0.6rem; display: block; margin-top: 4px; }

        .group-title {
            color: var(--purple); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;
            border-left: 3px solid var(--purple); padding-left: 10px;
        }
        .group-title.cyan { color: var(--accent); border-color: var(--accent); }
        .bridge-badge { background: var(--purple); color: #000; font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; display: none; letter-spacing: 0; }

        .config-preview {
            background: #1a2330; padding: 10px 12px; border-radius: 10px; margin-top: 12px;
            font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; line-height: 1.5; white-space: pre-line;
        }
        .config-preview.bad { color: var(--warning); }

        .analysis-card { background: #11151c; border: 2px solid var(--border); border-radius: 25px; padding: 25px; transition: border-color 0.3s ease; margin-bottom: 15px; }
        .status-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .status-desc { color: var(--dim); font-size: 0.85rem; line-height: 1.5; }
        .status-desc b { color: #fff; }

        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 15px; font-size: 0.8rem; }
        .details span { color: var(--dim); }
        .details b { text-align: right; font-variant-numeric: tabular-nums; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="theme-cyan">

    <div class="top-bar">
        <a href="index.html" class="btn-back" aria-label="Voltar"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="container">
        <div class="header-page"><i class="fas fa-microchip"></i><h1>Projeto do Sistema</h1></div>

        <!-- Resultados rápidos -->
        <div class="results-grid">
            <div class="res-item"><span class="lab">Impedância</span><span class="val" id="res-imp">0Ω</span></div>
            <div class="res-item active"><span class="lab">Vrms Limiter</span><span class="val" id="res-vrms">0V</span><span class="sub" id="res-vpk">pico 0V</span></div>
            <div class="res-item"><span class="lab">Amp nesta carga</span><span class="val" id="res-pot">0W</span></div>
        </div>

        <!-- Análise -->
        <div id="status-card" class="analysis-card">
            <div id="status-title" class="status-title">ANÁLISE</div>
            <div id="status-desc" class="status-desc">Preencha os dados para analisar o cenário.</div>
        </div>

        <!-- 1. Amplificador -->
        <div class="control-group">
            <span class="group-title">1. Amplificador <span id="bridge-badge" class="bridge-badge">MODO PONTE</span></span>
            <div class="row">
                <div>
                    <label for="a-ch">Canais</label>
                    <select id="a-ch">
                        <option value="1">1 Canal (Mono)</option>
                        <option value="2">2 Canais</option>
                        <option value="4" selected>4 Canais</option>
                    </select>
                </div>
                <div>
                    <label for="a-mo">Modo Saída</label>
                    <select id="a-mo">
                        <option value="st">STEREO</option>
                        <option value="br">BRIDGE</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="a-min">Ω Mín. Canal</label>
                    <select id="a-min">
                        <option value="0.5">0.5 Ω</option>
                        <option value="1">1.0 Ω</option>
                        <option value="2" selected>2.0 Ω</option>
                        <option value="4">4.0 Ω</option>
                        <option value="8">8.0 Ω</option>
                    </select>
                </div>
                <div>
                    <label for="a-w">Watts/Canal no Ω mín.</label>
                    <input type="number" id="a-w" value="3000" min="0" inputmode="numeric">
                </div>
            </div>
            <div class="note"><i class="fas fa-info-circle"></i> Use a potência RMS por canal que o fabricante informa na impedância mínima.</div>
        </div>

        <!-- 2. Carga -->
        <div class="control-group" style="border-color: var(--accent)">
            <span class="group-title cyan">2. Carga por Saída</span>
            <div class="row">
                <div>
                    <label for="q">Qtd Falantes</label>
                    <input type="number" id="q" value="16" min="1" step="1" inputmode="numeric">
                </div>
                <div>
                    <label for="f-i">Ohms Unit.</label>
                    <select id="f-i">
                        <option value="2">2 Ω</option>
                        <option value="4">4 Ω</option>
                        <option value="8" selected>8 Ω</option>
                        <option value="16">16 Ω</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="f-w">Watts RMS (cada)</label>
                    <input type="number" id="f-w" value="200" min="0" inputmode="numeric">
                </div>
                <div>
                    <label for="t">Ligação</label>
                    <select id="t">
                        <option value="p">Paralelo</option>
                        <option value="s">Série</option>
                        <option value="sp" selected>Série-Paralelo</option>
                    </select>
                </div>
            </div>
            <div class="row" id="sp-row">
                <div>
                    <label for="n-serie">Falantes em cada série</label>
                    <input type="number" id="n-serie" value="2" min="1" step="1" inputmode="numeric">
                </div>
                <div>
                    <label>Ramos em paralelo</label>
                    <input type="text" id="n-ramos" readonly>
                </div>
            </div>
            <div class="config-preview" id="preview"></div>
        </div>

        <!-- Detalhes -->
        <div class="control-group">
            <span class="section-label">Detalhes</span>
            <div class="details" id="details"></div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const FIELDS = ['a-ch', 'a-mo', 'a-min', 'a-w', 'q', 'f-i', 'f-w', 't', 'n-serie'];
        const STORAGE_KEY = 'audiobase-projeto';

        // ---------- helpers ----------
        const num = (id, def = 0) => { const v = parseFloat($(id).value); return isNaN(v) || v < 0 ? def : v; };
        const fmtOhm = z => (Math.round(z * 100) / 100) + 'Ω';
        const fmtW = w => w >= 10000 ? (w / 1000).toFixed(1) + 'kW' : Math.round(w) + 'W';

        function checkMono() {
            const mono = $('a-ch').value === '1';
            if (mono) $('a-mo').value = 'st';
            $('a-mo').disabled = mono;
        }

        // ---------- impedância da carga ----------
        // Retorna { z, ok, texto } para a ligação escolhida
        function cargaInfo(q, fi, t, nSerie) {
            if (t === 'p') return { z: fi / q, ok: true, txt: `${q} × ${fi}Ω em paralelo` };
            if (t === 's') return { z: fi * q, ok: true, txt: `${q} × ${fi}Ω em série` };

            // Série-paralelo: grupos de nSerie falantes em série, ligados em paralelo
            if (nSerie < 1 || q % nSerie !== 0) {
                return { z: NaN, ok: false, txt: `${q} falantes não dividem em grupos de ${nSerie}. Escolha um número que divida ${q}.` };
            }
            const ramos = q / nSerie;
            const zGrupo = fi * nSerie;
            return {
                z: zGrupo / ramos, ok: true, ramos,
                txt: `${ramos} ramo(s) de ${nSerie} × ${fi}Ω em série (${zGrupo}Ω cada)\n→ ${ramos} × ${zGrupo}Ω em paralelo = ${fmtOhm(zGrupo / ramos)}`
            };
        }

        // ---------- cálculo principal ----------
        function calc() {
            checkMono();
            const ch = parseInt($('a-ch').value);
            const bridge = $('a-mo').value === 'br' && ch > 1;
            const aw = num('a-w');
            const amin = parseFloat($('a-min').value);
            const q = Math.max(1, Math.round(num('q', 1)));
            const fi = parseFloat($('f-i').value);
            const fw = num('f-w');
            const t = $('t').value;
            const nSerie = Math.max(1, Math.round(num('n-serie', 1)));

            $('sp-row').classList.toggle('hidden', t !== 'sp');
            $('bridge-badge').style.display = bridge ? 'inline-block' : 'none';

            const carga = cargaInfo(q, fi, t, nSerie);
            $('n-ramos').value = carga.ramos ? carga.ramos : '-';
            $('preview').textContent = carga.txt;
            $('preview').classList.toggle('bad', !carga.ok);
            if (!carga.ok) { showStatus('var(--warning)', '<i class="fas fa-circle-question"></i> LIGAÇÃO INVÁLIDA', carga.txt); return; }

            const z = carga.z;
            const pt = fw * q;                       // potência RMS que os falantes aguentam
            const vrms = Math.sqrt(pt * z);          // tensão que leva os falantes ao RMS nominal
            const vpk = vrms * Math.SQRT2;

            // Amplificador modelado como fonte de tensão:
            // a tensão máxima por canal vem da potência no Ω mínimo (V = √(P·R)).
            // Em ponte, a tensão dobra e o Ω mínimo também dobra.
            const vCh = Math.sqrt(aw * amin);
            const vAmp = bridge ? 2 * vCh : vCh;
            const zMin = bridge ? 2 * amin : amin;
            const pAmp = vAmp * vAmp / z;            // potência disponível nesta carga
            const headroom = pt > 0 ? pAmp / pt : 0;
            const saidas = bridge ? ch / 2 : ch;

            $('res-imp').textContent = fmtOhm(z);
            $('res-vrms').textContent = vrms.toFixed(1) + 'V';
            $('res-vpk').textContent = 'pico ' + vpk.toFixed(1) + 'V';
            $('res-pot').textContent = fmtW(pAmp);

            $('details').innerHTML = `
                <span>Potência RMS dos falantes</span><b>${fmtW(pt)}</b>
                <span>Tensão máx. do amp (${bridge ? 'ponte' : 'canal'})</span><b>${vAmp.toFixed(1)} V</b>
                <span>Ω mínimo ${bridge ? 'em ponte' : 'por canal'}</span><b>${fmtOhm(zMin)}</b>
                <span>Saídas disponíveis</span><b>${saidas}</b>
                <span>Corrente RMS na carga</span><b>${(vrms / z).toFixed(1)} A</b>
                <span>Sistema completo (${saidas} saídas iguais)</span><b>${q * saidas} falantes • ${fmtW(pt * saidas)}</b>`;

            if (z < zMin) {
                showStatus('var(--danger)', '<i class="fas fa-radiation"></i> PERIGO: IMPEDÂNCIA BAIXA',
                    `Sua carga de <b>${fmtOhm(z)}</b> está abaixo do mínimo de <b>${fmtOhm(zMin)}</b>${bridge ? ' em ponte' : ''}. O amplificador vai sobreaquecer, entrar em proteção ou queimar os transistores. <b>Corrija a ligação!</b>`);
            } else if (headroom < 1) {
                showStatus('var(--warning)', '<i class="fas fa-exclamation-triangle"></i> ATENÇÃO: RISCO DE CLIPPING',
                    `Nesta carga o amplificador entrega cerca de <b>${fmtW(pAmp)}</b>, só ${(headroom * 100).toFixed(0)}% dos ${fmtW(pt)} que os falantes aguentam. Ao subir o volume ele vai clipar (onda quadrada), o que esquenta bobinas e queima tweeters.`);
            } else if (headroom > 2.5) {
                showStatus('var(--warning)', '<i class="fas fa-exclamation-circle"></i> ATENÇÃO: EXCESSO DE FORÇA',
                    `O amplificador tem ${headroom.toFixed(1)}x a potência dos falantes. Alto risco de <b>dano mecânico</b> (bobina pulando, cone rasgando). O limiter em <b>${vrms.toFixed(1)} Vrms</b> é obrigatório!`);
            } else {
                showStatus('var(--success)', '<i class="fas fa-check-circle"></i> SISTEMA IDEAL',
                    `Headroom de <b>${headroom.toFixed(1)}x</b> (${fmtW(pAmp)} disponíveis para ${fmtW(pt)} de falantes). Configure o limiter em <b>${vrms.toFixed(1)} Vrms</b> (${vpk.toFixed(1)} V de pico) para proteção.`);
            }
        }

        function showStatus(color, title, desc) {
            $('status-card').style.borderColor = color;
            $('status-title').style.color = color;
            $('status-title').innerHTML = title;
            $('status-desc').innerHTML = desc;
        }

        // ---------- salvar/restaurar os campos neste aparelho ----------
        function save() {
            try {
                const data = {};
                FIELDS.forEach(id => data[id] = $(id).value);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) { /* armazenamento indisponível: segue sem salvar */ }
        }
        function restore() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                FIELDS.forEach(id => { if (data[id] !== undefined) $(id).value = data[id]; });
            } catch (e) { /* ignora */ }
        }

        FIELDS.forEach(id => {
            $(id).addEventListener('input', () => { calc(); save(); });
            $(id).addEventListener('change', () => { calc(); save(); });
        });
        restore();
        calc();
    </script>
</body>
</html>
